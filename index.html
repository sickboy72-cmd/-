<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폰트 자산 분석 웹 리포트</title>
    <!-- Tailwind CSS 제공으로 현대적인 리포트 UI 스타일링 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="p-6 md:p-12 text-slate-800">

    <div class="max-w-7xl mx-auto">
        <!-- 리포트 헤더 -->
        <header class="mb-10 pb-6 border-b border-slate-200">
            <div class="flex items-center gap-3 mb-2">
                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold tracking-wider uppercase">System Report</span>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">웹 폰트 리소스 카탈로그 리포트</h1>
            <p class="text-slate-500 mt-1">시스템에서 호출하고 있는 부트스트랩 웹 폰트 목록 및 메타데이터 현황 분석 리포트입니다.</p>
        </header>

        <!-- 핵심 요약 메트릭 보드 & 검색 바 -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm font-medium text-slate-500">검색된 폰트 수 / 총 폰트 수</p>
                <p id="total-fonts" class="text-3xl font-bold text-blue-600 mt-2">0개</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm font-medium text-slate-500">빌드 버전 (Bootstrap)</p>
                <p id="build-version" class="text-xl font-semibold text-slate-800 mt-3">불러오는 중...</p>
            </div>
            <!-- 실시간 검색 필터 추가 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-center">
                <label for="search-input" class="text-sm font-medium text-slate-500 mb-2">폰트 실시간 검색</label>
                <input type="text" id="search-input" placeholder="폰트명을 입력하세요..." 
                       class="w-full px-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
        </section>

        <!-- 폰트 목록 리포트 그리드 -->
        <main>
            <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                📁 등록 폰트 리스트
            </h2>
            <!-- 검색 결과가 없을 때 보여줄 메시지 -->
            <div id="no-result" class="hidden text-center py-12 text-slate-400 text-sm">
                검색 결과와 일치하는 폰트가 없습니다.
            </div>
            <div id="font-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 자바스크립트로 카드가 동적 생성됩니다. -->
            </div>
        </main>
    </div>

    <!-- 폰트 상세 보기 모달 팝업 추가 -->
    <div id="font-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <!-- 모달 헤더 -->
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div>
                    <h3 id="modal-font-name" class="text-xl font-bold text-slate-900">Font Name</h3>
                    <p id="modal-font-meta" class="text-xs font-mono text-slate-400 mt-0.5">Meta Code</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition">
                    ✕
                </button>
            </div>
            <!-- 모달 바디 (실시간 타이핑 테스트) -->
            <div class="p-6">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">미리보기 텍스트 입력</label>
                <input type="text" id="modal-text-input" value="The quick brown fox jumps over the lazy dog." 
                       class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-6">
                
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">폰트 렌더링 화면</label>
                <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 min-h-[140px] flex items-center justify-center overflow-x-auto">
                    <p id="modal-preview-text" class="text-3xl text-center text-slate-800 leading-relaxed w-full break-words">
                        The quick brown fox jumps over the lazy dog.
                    </p>
                </div>
            </div>
            <!-- 모달 푸터 -->
            <div class="px-6 py-4 border-t border-slate-100 flex justify-end bg-slate-50">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium rounded-xl transition">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <script>
        const bootstrapData = {
            "A": "A",
            "B": "20261110-02-4b0863c",
            "C": {
                "ABeeZee": "YADK31-VBBc,1",
                "Abel": "YAHO2Ehol3g,0",
                "Abhaya Libre": "YAFdJvwa-l0,0",
                "Abril Fatface": "YACgEZbkUVE,0",
                "Aclonica": "YAHO2OEKYj0,0",
                "Acme": "YAHO2Gflqzo,0",
                "Actor": "YAHO2N0IV_4,0",
                "Adamina": "YAHO2Ko8ddg,0",
                "Advent Pro": "YAFdJvNZdCk,0",
                "Afacad": "YAHO2HaK_fU,0",
                "Afacad Flux": "YAHO2DjbA6Y,0",
                "Agrandir": "YAFdJpYuLss,0",
                "Aileron": "YAFdJn5d8s0,0",
                "Akshar": "YAGWNF0jApg,0",
                "Alata": "YAD1aLikJo8,0",
                "Albert Sans": "YAHO2HRfeh4,0"
            }
        };

        let loadedFonts = [];

        // 데이터 초기화 및 폰트 로드
        function initReport() {
            document.getElementById('build-version').innerText = bootstrapData.B;
            
            const fonts = bootstrapData.C;
            loadedFonts = Object.keys(fonts).map(name => ({
                name: name,
                meta: fonts[name]
            }));

            // 구글 웹폰트 리소스 동적 link 태그 생성
            loadedFonts.forEach(font => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = `https://googleapis.com{font.name.replace(/ /g, '+')}&display=swap`;
                document.head.appendChild(link);
            });

            // 초기 전체 렌더링
            renderGrid(loadedFonts);

            // 검색창 이벤트 바인딩
            document.getElementById('search-input').addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase();
                const filtered = loadedFonts.filter(font => font.name.toLowerCase().includes(keyword));
                renderGrid(filtered);
            });
        }

        // 그리드 렌더링 함수
        function renderGrid(fontList) {
            const fontGrid = document.getElementById('font-grid');
            const noResult = document.getElementById('no-result');
            
            // 기존 카드 삭제
            fontGrid.innerHTML = '';
            
            // 검색 개수 업데이트
            document.getElementById('total-fonts').innerText = `${fontList.length}개 / ${loadedFonts.length}개`;

            if (fontList.length === 0) {
                noResult.classList.remove('hidden');
                return;
            } else {
                noResult.classList.add('hidden');
            }

            // 카드 생성
            fontList.forEach(font => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl shadow-xs border border-slate-200/80 hover:shadow-md hover:border-slate-300 transition duration-200 flex flex-col justify-between cursor-pointer group";
                
                // 카드 클릭 시 모달 팝업 열기 연결
                card.onclick = () => openModal(font.name, font.meta);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition tracking-tight">${font.name}</h3>
                            <span class="text-[11px] font-mono bg-slate-100 text-slate-600 px-2 py-1 rounded">Code: ${font.meta.split(',')[0]}</span>
                        </div>
                        <div class="my-4 py-3 px-2 bg-slate-50 rounded-xl text-center border border-dashed border-slate-200 group-hover:bg-slate-100/50 transition">
                            <p style="font-family: '${font.name}', sans-serif;" class="text-2xl text-slate-800 truncate">
                                The quick brown fox
                            </p>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                        <span class="text-blue-500 font-medium group-hover:underline">자세히 보기 →</span>
                        <span class="font-semibold text-slate-500">Opt: ${font.meta.split(',')[1] || '0'}</span>
                    </div>
                `;
                fontGrid.appendChild(card);
            });
        }

        // 모달 열기 함수
        function openModal(name, meta) {
            const modal = document.getElementById('font-modal');
            const previewText = document.getElementById('modal-preview-text');
            const textInput = document.getElementById('modal-text-input');

            document.getElementById('modal-font-name').innerText = name;
